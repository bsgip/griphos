[workspace]
members = [".", "python"]

[package]
name = "griphos"
version = "0.1.0"
edition = "2024"
exclude = ["griphos_extras/src/"]

[package.metadata.e_json_schema]
url = "https://raw.githubusercontent.com/bsgip/epyjson/refs/heads/main/src/epyjson/e-json-schema.json"

[dependencies]
indexmap = {version = "2.14"}
inventory = {version = "0.3"}
nalgebra = {version = "0.35", features = ["macros", "serde-serialize"]}
num-traits = "0.2"
parking_lot = "0.12"
serde = {version = "1.0", features = ["derive"]}
serde_json = "1.0"
serde_yml = "0.0.12" # TODO: deprecated/unmaintaned.
sprs = "0.11"
petgraph = {version = "0.8", features = ["serde-1"]}
klu_sys = "0.2"
log = "0.4"
env_logger = "0.11"
rand = "0.10"
itertools = "0.15"
clap = { version = "4.6", features = ["derive"] }
regress = "0.11"
regex = "1.12"

[build-dependencies]
serde_json = "1.0"
toml = "1.1"
typify = "0.7"
ureq = "3.3"

[dev-dependencies]
criterion = "0.8"
glob = "0.3"

[[bin]]
name = "test_griphos"
path = "test_data/test_griphos.rs"

[[bench]]
name = "benchmarks"
harness = false
