[workspace]
members = [".", "python", "griphos-proc-macros"]

[package]
name = "griphos"
version = "0.1.7"
documentation = "https://bsgip.github.io/griphos/griphos/"
edition = "2024"
exclude = ["griphos_extras/src/"]
readme = "README.md"

[package.metadata.e_json_schema]
url = "https://raw.githubusercontent.com/bsgip/epyjson/refs/heads/main/src/epyjson/e-json-schema.json"

[dependencies]
indexmap = {version = "2.14"}
inventory = {version = "0.3"}
nalgebra = {version = "0.35", features = ["macros", "serde-serialize"]}
num-traits = "0.2"
parking_lot = "0.12"
serde = {version = "1.0", features = ["derive"]}
serde_json = { version = "1.0", features = ["raw_value"] }
serde_yml = "0.0.12" # TODO: deprecated/unmaintaned.
sprs = "0.11"
petgraph = {version = "0.8", features = ["serde-1"]}
klu_sys = "0.2"
log = "0.4"
env_logger = "0.11"
rand = "0.10"
itertools = "0.15"
clap = { version = "4.6", features = ["derive"] }
regress = "0.11"
regex = "1.12"
bitflags = "2.13"
griphos-proc-macros = { path = "griphos-proc-macros" }
thiserror = "2.0.21"

[build-dependencies]
serde_json = "1.0"
schemars = "0.8"
toml = "1.1"
typify = "0.8"
ureq = "3.3"

[dev-dependencies]
criterion = "0.8"
glob = "0.3"

[[example]]
name = "test_griphos"
path = "performance_testing/test_griphos.rs"

[[example]]
name = "compare_solvers"
path = "performance_testing/compare_solvers.rs"

[[example]]
name = "profile"
path = "performance_testing/profile.rs"

[[bench]]
name = "benchmarks"
harness = false
