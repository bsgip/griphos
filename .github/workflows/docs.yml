name: Docs

on:
  push:
    branches: [ "main" ]

#permissions:
#  contents: read
#  pages: write
#  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build docs
        run: cargo doc --no-deps -p griphos 

      - name: Add index redirect
        run: echo '<meta http-equiv="refresh" content="0; url=griphos/index.html">' > target/doc/index.html

      #- uses: actions/upload-artifact@v4 #actions/upload-pages-artifact@v3
      #  with:
      #    path: target/doc
      - uses: actions/upload-artifact@v4
        with:
          name: docs
          path: target/doc

