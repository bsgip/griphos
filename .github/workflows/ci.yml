name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: dtolnay/rust-toolchain@stable

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: |
          .
          python

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Run rust tests
      run: cargo test --verbose

    - name: Run rust tests in python crate
      run: cargo test --verbose
      working-directory: python

    - name: Check Python stubs are up to date
      working-directory: python
      run: |
        cargo run --bin stub_gen
        if [ -n "$(git status --porcelain -- .)" ]; then
          echo "::error::Generated .pyi stubs are out of date. Run 'cargo run --bin stub_gen' in python/ and commit the result."
          git status --short -- .
          git diff -- .
          exit 1
        fi

    - name: Install uv
      uses: astral-sh/setup-uv@v3

    - name: Install Python bindings and test dependencies
      run: uv pip install --system . pytest

    - name: Run Python tests
      run: pytest
