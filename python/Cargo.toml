[package]
name = "griphos-py"
version = "0.1.0"
edition = "2024"

[lib]
name = "griphos_py"
crate-type = ["cdylib", "rlib"]

[dependencies]
bitflags = "2.1"
griphos = { path = ".." }
pyo3 = { version = "0.29", features = ["num-complex"] }
pyo3-stub-gen = "0.23"

[features]
extension-module = ["pyo3/extension-module"]

[[bin]]
name = "stub_gen"
path = "src/bin/stub_gen.rs"
